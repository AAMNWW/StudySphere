services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: studysphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studysphere
      POSTGRES_PASSWORD: studysphere_dev_password
      POSTGRES_DB: studysphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysphere -d studysphere"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
